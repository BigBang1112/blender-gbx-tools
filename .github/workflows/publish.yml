name: Build and Package

on:
  workflow_dispatch:
  
env:
  EXECUTABLE_NAME: BlenderGbxTools

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            executable-extension: .exe
          - os: ubuntu-latest
            executable-extension: ""

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish application
      run: dotnet publish ${{ env.EXECUTABLE_NAME }} -o ./publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: ./publish/${{ env.EXECUTABLE_NAME }}${{ matrix.executable-extension }}
        retention-days: 1

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: build-*
        path: ./BlenderPlugin
        merge-multiple: true

    - name: Create plugin zip
      run: |
        cd BlenderPlugin
        zip -r ../BlenderGbxTools.zip .
        cd ..

    - name: Upload BlenderGbxTools package
      uses: actions/upload-artifact@v4
      with:
        path: BlenderGbxTools.zip
        retention-days: 7
