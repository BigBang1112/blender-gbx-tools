name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, created at the selected commit if it doesn't exist
        type: string
        required: true
      description:
        description: Text before the release notes
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    uses: bigbang1112/workflows/.github/workflows/publish-app-immutable.yml@main
    permissions:
      contents: write
    with:
      project: BlenderGbxTools
      dotnet-version: 10.0.x
      files: |
        BlenderGbxTools
        BlenderGbxTools.exe
      package-directory: BlenderPlugin
      merge-runners: true
      asset-name: BlenderGbxTools
      tag: ${{ inputs.tag }}
      release-description: ${{ inputs.description }}
      generate-release-notes: true